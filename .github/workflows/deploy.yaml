name: Deploy single app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust server host key
        run: |
          set -euo pipefail
          : "${{ secrets.SSH_HOST }}"
          : "${{ secrets.SSH_PORT }}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          for v in SSH_HOST SSH_PORT SSH_USER DEPLOY_PATH; do
            if [ -z "${!v}" ]; then
              echo "::error::$v secret is empty"
              exit 1
            fi
          done

          SSH_BASE=(ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          RSYNC_RSH="ssh -p ${SSH_PORT} -o BatchMode=yes -o StrictHostKeyChecking=yes"
          RELEASE="$(date -u +%Y%m%d%H%M%S)"

          echo "Deploying $RELEASE → $SSH_USER@$SSH_HOST:$DEPLOY_PATH"

          "${SSH_BASE[@]}" "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DEPLOY_PATH/releases/$RELEASE' '$DEPLOY_PATH/media' '$DEPLOY_PATH/data' '$DEPLOY_PATH/notifier' '$DEPLOY_PATH/bin'"

          # App shell only — media lives in $DEPLOY_PATH/media (nginx alias).
          rsync -az --delete \
            --exclude media/ \
            -e "$RSYNC_RSH" \
            dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/releases/$RELEASE/"

          # Lightweight media; videos stay on the server.
          if [ -d dist/media ]; then
            rsync -az \
              --exclude '*.wav' \
              --exclude 'video/' \
              -e "$RSYNC_RSH" \
              dist/media/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/media/"
          fi

          if [ -d scripts/notifier ]; then
            rsync -az \
              -e "$RSYNC_RSH" \
              scripts/notifier/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/notifier/"
          fi

          if [ -f deploy/disk-alert.sh ]; then
            rsync -az \
              -e "$RSYNC_RSH" \
              deploy/disk-alert.sh "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/bin/disk-alert.sh"
            "${SSH_BASE[@]}" "$SSH_USER@$SSH_HOST" "chmod +x '$DEPLOY_PATH/bin/disk-alert.sh'"
          fi

          "${SSH_BASE[@]}" "$SSH_USER@$SSH_HOST" "
            ln -sfn '$DEPLOY_PATH/releases/$RELEASE' '$DEPLOY_PATH/current' &&
            sudo -n /usr/bin/systemctl reload nginx &&
            readlink -f '$DEPLOY_PATH/current'
          "

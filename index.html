<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F9F6EE" />
    <meta name="description" content="Медитация с Шри Шри — guided практики и таймер" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sri Sri Meditate" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Work+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- VK: Init ДО React, иначе «приложение не инициализировано» -->
    <script src="/vk-bridge.min.js"></script>
    <script>
      (function () {
        // На vk.* всегда init; иначе — по launch-параметрам
        var q = location.search || '';
        var inVk =
          location.hostname === 'vk.aolapp.ru' ||
          /(?:^|[?&])vk_app_id=/.test(q);
        if (!inVk || !window.vkBridge) return;
        try {
          window.__vkInitPromise = window.vkBridge.send('VKWebAppInit');
        } catch (e) {}
      })();
    </script>
    <title>Meditate with Sri Sri</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
